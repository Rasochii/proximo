name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  functions:
    name: Functions · typecheck, lint e testes
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:coverage

  emulators:
    name: Functions · regras e integração nos emuladores
    runs-on: ubuntu-latest
    needs: functions
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - run: npm install
      - run: npm install -g firebase-tools
      - run: npm run test:emulator

  app:
    name: App · análise e testes
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter gen-l10n
      - name: Análise estática (com anotações no GitHub)
        run: |
          dart analyze --format=machine > analysis.txt 2>&1 || true
          awk -F'|' -v root="$GITHUB_WORKSPACE/" 'NF >= 8 { path = $4; sub(root, "", path); level = ($1 == "ERROR") ? "error" : "warning"; printf "::%s file=%s,line=%s,col=%s,title=%s::%s\n", level, path, $5, $6, $3, $8 }' analysis.txt
          flutter analyze
      - run: flutter test --coverage
