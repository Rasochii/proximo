include: package:very_good_analysis/analysis_options.yaml

formatter:
  page_width: 100

analyzer:
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "lib/l10n/gen/**"
  errors:
    invalid_annotation_target: ignore
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

linter:
  rules:
    # App (não é pacote publicado): documentação pública não é obrigatória.
    public_member_api_docs: false
    lines_longer_than_80_chars: false
    # Tipos de providers do Riverpod (ex.: StreamProvider.autoDispose.family) são longos e
    # inferidos com precisão; anotar à mão só adiciona ruído.
    specify_nonobvious_property_types: false
