include: package:very_good_analysis/analysis_options.yaml

formatter:
  page_width: 100

analyzer:
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "lib/l10n/gen/**"
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**
  errors:
    invalid_annotation_target: ignore
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

linter:
  rules:
    # App (não é pacote publicado): documentação pública não é obrigatória.
    public_member_api_docs: false
    lines_longer_than_80_chars: false
