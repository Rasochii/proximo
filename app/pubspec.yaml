name: proximo
description: "Próximo! — fila virtual para barbearias."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.8.0
  flutter: ">=3.32.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Estado e navegação
  flutter_riverpod: ^3.0.0
  riverpod_annotation: ^3.0.0
  go_router: ^16.0.0

  # Firebase
  firebase_core: ^4.0.0
  firebase_auth: ^6.0.0
  cloud_firestore: ^6.0.0
  cloud_functions: ^6.0.0
  firebase_app_check: ^0.4.0

  # Modelos
  freezed_annotation: ^3.0.0
  json_annotation: ^4.9.0

  # Utilidades
  intl: any
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.5.4
  riverpod_generator: ^3.0.0
  freezed: ^3.0.0
  json_serializable: ^6.9.5
  mocktail: ^1.0.4
  very_good_analysis: ^9.0.0

flutter:
  uses-material-design: true
  generate: true
